# Type checks: `mypy` (tools in requirements-dev.txt).
[mypy]
python_version = 3.12
files = pipeline, tests
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
# New code is checked inside untyped functions too.
check_untyped_defs = True

# The pipeline submitted to Space Apps 2026 is left untouched while it is judged. With
# check_untyped_defs it reports 28 issues, nearly all because dict literals such as
# HABITATS mix str and float values and are inferred as dict[str, object]; typing them
# with TypedDicts is the planned fix after judging.
[mypy-pipeline.*]
check_untyped_defs = False
