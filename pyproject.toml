[project]
name = "skylab-phoenix"
version = "1.0.0"
description = "Fire-safety insights from NASA microgravity combustion data (NASA Space Apps Challenge 2026)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long data literals and messages read better on one line
    "E731",    # short lambdas used as local helpers
    "RUF001",  # ×, –, ² and other symbols are intentional in user-facing text
    "RUF046",  # explicit int() around numpy rounding keeps plain Python ints in JSON
]

[tool.pytest.ini_options]
testpaths = ["tests"]
