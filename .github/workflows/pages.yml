name: Publish dashboard

# GitHub Pages serves the gh-pages branch. This publishes the web/ folder there on every push to main,
# replacing the manual `git subtree push --prefix web origin gh-pages`.
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push web/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix web -b pages-build
          git push --force origin pages-build:gh-pages
